<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>League Hub demo</title>
<meta name="description" content="Live scores, standings, playoffs and more for our ESPN fantasy football league.">
<meta name="theme-color" content="#161c23" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161c23; --panel:#1e262f; --panel2:#27313b; --line:#33404c;
  --text:#eef2f5; --muted:#9dabb8; --faint:#6f7d8a;
  --accent:#3b8eea; --accent-text:#7db1f0; --on-accent:#ffffff;
  --up:#66cc92; --down:#f2917a;
  --r-lg:14px; --r-sm:8px;
  --font:"Archivo","Arial Narrow","Helvetica Neue",Arial,system-ui,sans-serif;
  --tabbar-h:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#eef1f4; --panel:#ffffff; --panel2:#f4f6f8; --line:#d7dde3;
    --text:#141a21; --muted:#56636f; --faint:#7f8b96;
    --accent-text:#2963a4;
    --up:#1a7a44; --down:#b3432a;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 24px)}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.badge{width:32px;height:32px;flex:none;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:900;font-stretch:110%;font-size:18px;line-height:1}
.badge svg{width:24px;height:24px;display:block}
.wordmark{font-weight:900;font-stretch:115%;font-size:18px;letter-spacing:-.01em;line-height:1.05;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wordmark span{display:block;font-weight:500;font-stretch:100%;font-size:12px;letter-spacing:0;color:var(--muted);margin-top:3px}
.status{margin-left:auto;text-align:right;line-height:1.15;white-space:nowrap}
.status b{display:block;font-stretch:75%;font-weight:800;font-size:20px;color:var(--accent-text)}
.status small{color:var(--muted);font-size:12px}
.refresh{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer}
.refresh svg{width:18px;height:18px}
.refresh.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.desk-nav{display:none}
@media (min-width:760px){.phone-only{display:none}}

/* Bottom tab bar (phones) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a{flex:1;min-width:0;height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap}
.tabbar svg{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--accent-text)}

/* Layout */
main{max-width:1080px;margin:0 auto;padding:18px 16px 0}
.banner{max-width:1080px;margin:12px auto 0;padding:0 16px}
.banner p{margin:0;padding:10px 14px;border-radius:var(--r-sm);background:var(--panel2);border:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner button{background:none;border:0;color:var(--accent-text);font-weight:700;cursor:pointer;padding:0}
.banner .chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:2px 0;color:var(--muted);font-weight:600;font-size:13px;background:var(--panel)}
.banner .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.banner .get{color:var(--accent-text);font-weight:700;white-space:nowrap}
h1{font-stretch:62%;font-weight:900;font-size:44px;line-height:.95;margin:0;letter-spacing:-.01em}
h2{font-size:20px;font-weight:800;margin:34px 0 12px;letter-spacing:-.005em}
h2 + .lede{margin-top:-6px}
.lede{color:var(--muted);margin:6px 0 16px;font-size:15px;max-width:62ch}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.empty{padding:22px 18px}
.empty p{margin:0 0 6px}
.crown{display:inline-block;width:18px;height:12px;margin-left:5px;vertical-align:-1px}
.crown path{fill:var(--accent)}

/* This Week */
.ticker{position:relative;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.tk-track{display:flex;width:max-content;will-change:transform}
.tk{display:grid;grid-template-columns:auto auto;column-gap:5px;padding:11px 18px 12px;text-decoration:none;color:inherit;white-space:nowrap;-webkit-user-drag:none;-webkit-tap-highlight-color:transparent}
.tk-r,.tk-n{font-weight:700;font-size:15px;line-height:1.25}
.tk-r{color:var(--muted)}
.tk-s{grid-column:2;font-size:14px;color:var(--muted);margin-top:3px}
.tk-s b{font-weight:800;color:var(--text)}
.matches{display:grid;gap:12px}
.match{position:relative;overflow:hidden;padding:12px 14px 12px 20px}
.match::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--mc,var(--line))}
.side{display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:center;min-height:62px}
.tn{font-weight:700;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.mg{color:var(--muted);font-size:13px}
.score{font-stretch:62%;font-weight:800;font-size:44px;line-height:1;text-align:right;grid-row:span 2;align-self:center}
.note{font-size:13px;color:var(--muted)}
.side.fav .note{color:var(--accent-text);font-weight:700}
.side.win .note{color:var(--accent-text);font-weight:800}
.side.lose .score,.side.lose .tn{color:var(--muted)}
.divider{display:flex;align-items:center;gap:10px;margin:8px 0;color:var(--muted);font-size:12px;font-weight:700}
.divider i{flex:1;height:1px;background:var(--line)}
.divider .go{width:16px;height:16px;flex:none;color:var(--faint);margin-right:-4px}
a.match{display:block;text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent;transition:border-color .15s}
a.match:hover{border-color:var(--muted)}
.champ-card{padding:18px;display:flex;gap:16px;align-items:center;border-color:var(--accent)}
.champ-card svg{width:46px;height:46px;flex:none;color:var(--accent)}
.champ-card .k{font-size:13px;color:var(--muted);font-weight:600}
.champ-card .v{font-stretch:75%;font-weight:900;font-size:28px;line-height:1.05}

/* Matchup detail */
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;margin:0 0 12px}
.back svg{width:18px;height:18px}
.mh{position:relative;overflow:hidden;padding:16px 16px 14px}
.mh::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--mc,var(--line))}
.mh-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mh-side .tn{font-size:16px}
.mh-side.R{text-align:right}
.mh-score{font-stretch:62%;font-weight:800;font-size:50px;line-height:1;margin-top:10px}
.mh-side .note{margin-top:2px}
.mh-side.fav .note,.mh-side.win .note{color:var(--accent-text);font-weight:800}
.mh-side.lose .mh-score,.mh-side.lose .tn{color:var(--muted)}
.wp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:16px}
.wp b{font-stretch:75%;font-weight:800;font-size:18px}
.wpbar{display:flex;gap:3px;height:8px}
.wpbar i{display:block;border-radius:4px;background:var(--line)}
.wpbar i.fav{background:var(--accent)}
.wp b.fav{color:var(--accent-text)}
.wpl{text-align:center;font-size:12.5px;color:var(--muted);margin-top:6px}
.lineup{margin-top:12px;overflow:hidden}
.lr{display:grid;grid-template-columns:minmax(0,1fr) 42px 34px 42px minmax(0,1fr);align-items:stretch;border-bottom:1px solid var(--line)}
.lr:last-child{border-bottom:0}
.lr.solo{grid-template-columns:34px 42px minmax(0,1fr)}
.lr .pl{padding:7px 5px 7px 10px;min-width:0;align-self:center}
.lr .pl.R{text-align:right;padding:7px 10px 7px 5px}
.pl > div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn{font-weight:700;font-size:12.5px;line-height:16px}
.pn .inj{color:var(--down);font-weight:800;font-size:10px;margin-left:3px}
.pm,.pg,.ps{font-size:10.5px;line-height:14px;color:var(--muted)}
.pg.on{color:var(--text)}
.nw{white-space:nowrap}
.pp{align-self:center;text-align:right;padding-right:5px}
.pp.R{text-align:left;padding:0 0 0 5px}
.pp b{display:block;font-stretch:75%;font-weight:800;font-size:15px;line-height:1.15}
.pp b.dash{color:var(--faint)}
.pp small{display:block;font-size:10.5px;color:var(--muted)}
.pl.done .pn,.pp.done b{color:var(--muted)}
.pl.done .pm,.pl.done .pg,.pl.done .ps,.pp.done small{color:var(--faint)}
.sl{display:grid;place-items:center;background:var(--panel2);font-size:9.5px;font-weight:800;color:var(--muted);text-align:center;line-height:1.1;padding:0 2px}
.lsec{padding:8px 14px;font-size:13px;font-weight:700;color:var(--muted);background:var(--panel2);border-bottom:1px solid var(--line)}
.pl.none .pn{color:var(--faint);font-weight:500}

/* Segmented control and week picker */
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;margin:0 0 12px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.weekpick{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 0 6px;scrollbar-width:thin}
.weekpick button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.weekpick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* Tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;white-space:nowrap}
.tbl .rk{width:34px;font-stretch:62%;font-weight:800;font-size:22px;color:var(--muted)}
.tbl .big{font-stretch:75%;font-weight:800;font-size:19px}
.tbl .tn{font-size:16px}
.tbl .wide{display:none}
.cutline td{padding:0;border-bottom:0}
.cutline div{border-top:2px dashed var(--accent);margin:0 8px;position:relative;height:0}
.cutline span{position:absolute;right:0;top:-10px;background:var(--panel);padding:0 6px;font-size:11.5px;font-weight:700;color:var(--accent-text)}
.tbl-wrap{overflow-x:auto}
.games-list .gm{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.games-list .gm:last-child{border-bottom:0}
.games-list .gm .tn{font-size:15px;font-weight:600}
.games-list .gm .tn.w{font-weight:800}
.games-list .gm .sc{font-stretch:75%;font-weight:700;font-size:18px;text-align:right}
.games-list .gm .sc.w{font-weight:900;color:var(--accent-text)}
.games-list .gm .lbl{grid-column:1/3;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

/* Points race */
.race-list{padding:4px 0}
.pr{display:grid;grid-template-columns:34px 1fr auto;column-gap:10px;row-gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.pr:last-child{border-bottom:0}
.pr .rk{font-stretch:62%;font-weight:800;font-size:22px;color:var(--muted)}
.pr .tot{font-stretch:75%;font-weight:800;font-size:22px;text-align:right;line-height:1}
.pr .pb{font-size:12.5px;color:var(--muted);text-align:right}
.pr .bar{grid-column:2/4;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.pr .bar i{display:block;height:100%;background:var(--muted);border-radius:3px}
.pr.top .bar i{background:var(--accent)}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wk{padding:10px 12px}
.wk .k{font-size:12.5px;color:var(--muted)}
.wk .v{font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}

/* Money */
.pot{padding:16px}
.pot .big{font-stretch:62%;font-weight:900;font-size:52px;line-height:1}
.pot .parts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:14px;color:var(--muted)}
.pot .parts b{color:var(--text);font-weight:700}
.people{overflow:hidden}
.person{border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person summary{list-style:none;display:grid;grid-template-columns:1fr auto 18px;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.person summary::-webkit-details-marker{display:none}
.person summary .chev{width:18px;height:18px;color:var(--faint);transition:transform .15s}
.person[open] summary .chev{transform:rotate(90deg)}
.bal{text-align:right;white-space:nowrap}
.bal b{display:block;font-stretch:75%;font-weight:800;font-size:20px;line-height:1.1}
.bal small{font-size:12px;color:var(--muted)}
.owes b{color:var(--down)}
.owed b{color:var(--up)}
.person-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 42px 12px 14px;border-bottom:1px solid var(--line)}
.paid-list{padding:12px 14px;font-size:14px;color:var(--muted);line-height:1.5}
.paid-list b{color:var(--text)}
.people > :last-child{border-bottom:0}
.lines{margin:0;padding:0 14px 12px 14px;display:grid;gap:4px}
.lines div{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.lines div b{color:var(--text);font-weight:600}
.lines .sum{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;color:var(--text);font-weight:700}
.prizes .place{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.prizes .place:last-child{border-bottom:0}
.prizes .nm{font-weight:700}
.prizes .amt{font-stretch:75%;font-weight:800;font-size:19px}
.prizes .who{grid-column:1/3;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.prizes .who b{color:var(--text)}

/* Playoffs */
.bracket{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.round{scroll-snap-align:start;display:flex;flex-direction:column;min-width:0}
.round-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.round-head b{font-size:15px}
.round-head span{font-size:12.5px;color:var(--muted)}
.games{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.glabel{font-size:12.5px;color:var(--muted);font-weight:700;margin:6px 0 -4px}
.bgame{padding:6px;display:grid;gap:4px}
.bgame.champ{border-color:var(--accent)}
a.bgame{text-decoration:none;color:inherit;transition:border-color .15s}
a.bgame:hover{border-color:var(--muted)}
.bteam{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;padding:7px 8px;border-radius:9px}
.bteam .sd{font-size:12px;color:var(--muted);font-weight:700;text-align:center}
.bteam .nm{font-weight:700;font-size:14.5px;line-height:1.2;overflow-wrap:anywhere}
.bteam .pj{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.bteam .sc{font-stretch:75%;font-weight:800;font-size:19px}
.bteam.win .sc,.bteam.win .nm{color:var(--accent-text)}
.bteam.lose{opacity:.55}
.bteam.tbd .nm{color:var(--faint);font-weight:500}
.bteam .byetag{font-size:12px;font-weight:700;color:var(--muted);font-stretch:100%}
.bgame.bye{border-style:dashed}
.bteam.hl{background:var(--panel2);box-shadow:inset 0 0 0 1.5px var(--accent);opacity:1}
.bracket.focus .bteam:not(.hl){opacity:.35}
.status-list{padding:4px 0}
.st{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;cursor:pointer}
.st:last-child{border-bottom:0}
.st .sd{font-stretch:62%;font-weight:800;font-size:20px;color:var(--muted)}
.st .tag{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.st.alive .tag{color:var(--accent-text)}
.st.out .tn{color:var(--muted)}
.st.hl{background:var(--panel2)}

/* League */
.rules{margin:0;padding:0 0 0 20px;display:grid;gap:8px;max-width:68ch}
.subhead{font-size:16px;font-weight:800;margin:22px 0 10px}
.titles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.title-card{padding:12px 14px}
.title-card .mgr{font-weight:800;font-size:17px}
.title-card .yrs{font-size:13.5px;color:var(--muted);margin-top:4px}
.trophy{color:var(--accent-text);font-weight:800}
.seasons{display:grid;gap:12px}
.season{padding:14px 16px}
.season-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.season-head b{font-stretch:62%;font-weight:900;font-size:32px;line-height:1}
.season-list{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.season-list li{display:grid;grid-template-columns:110px 1fr;gap:10px}
.season-list .k{color:var(--muted)}
.season-list .t{color:var(--muted);font-size:12.5px;display:block}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{display:inline-block;border:1px solid var(--line);background:var(--panel2);padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.55;cursor:default}
.tag-chip{display:inline-block;font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--panel2);color:var(--muted);margin-left:6px;vertical-align:1px}
footer{max-width:1080px;margin:40px auto 0;padding:0 16px;color:var(--faint);font-size:13px}
footer a{color:var(--muted)}

/* Commissioner Tools */
.cm-form{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px;max-width:460px}
.cm-in{font-size:16px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel2);color:var(--text);min-width:0}
.cm-form .cm-in{flex:1 1 180px}
.cm-grid{display:grid;gap:10px;padding:14px;max-width:560px}
.cm-grid label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.cm-msg{margin:12px 0 0;font-size:14px;font-weight:600}
.cm-msg.ok{color:var(--up)}
.cm-msg.err{color:var(--down)}
textarea.cm-in{min-height:84px;resize:vertical;font-size:14px;word-break:break-all}
.cm-steps{margin:0;padding-left:20px;display:grid;gap:6px;max-width:68ch;font-size:15px}

/* Wider screens */
@media (min-width:760px){
  body{padding-bottom:40px}
  .tabbar{display:none}
  .desk-nav{display:flex;gap:4px;margin-left:18px}
  .desk-nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px}
  .desk-nav a[aria-current="page"]{background:var(--panel2);color:var(--text)}
  main{padding-top:26px}
  h1{font-size:56px}
  .matches{grid-template-columns:1fr 1fr}
  .tbl .wide{display:table-cell}
  .lr{grid-template-columns:minmax(0,1fr) 56px 46px 56px minmax(0,1fr)}
  .lr.solo{grid-template-columns:46px 56px minmax(0,1fr)}
  .lr .pl{padding:8px 8px 8px 14px}
  .lr .pl.R{padding:8px 14px 8px 8px}
  .pn{font-size:14.5px;line-height:19px}
  .pm,.pg,.ps{font-size:12px;line-height:16px}
  .pp small{font-size:12px}
  .pp b{font-size:18px}
  .sl{font-size:11px}
}
@media (max-width:420px){
  .wordmark{font-size:15.5px;line-height:1.1;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .wordmark span{display:none}
  .score{font-size:40px}
  .tabbar a{font-size:10.5px}
  .season-list li{grid-template-columns:96px 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  }
  function historyBlock(f) {
    var seasons = f.history.slice().sort(function (a, b) { return b.season - a.season; });
    var names = (f.league || {}).managers !== false;
    var titles = {};
    seasons.forEach(function (s) {
      var c = s.champion; if (!c) return;
      var key = names && c.manager ? c.manager : c.name;
      (titles[key] = titles[key] || []).push(s.season);
    });
    var board = Object.keys(titles).map(function (k) { return { name: k, yrs: titles[k] }; })
      .sort(function (a, b) { return (b.yrs.length - a.yrs.length) || a.name.localeCompare(b.name); });
    var earliest = seasons[seasons.length - 1].season;
    var html = '<h2>League History</h2><p class="lede">Champions since ' + esc(earliest) + ', from ESPN</p><h3 class="subhead">Titles</h3><div class="titles">' +
      board.map(function (b) {
        return '<div class="card title-card"><div class="mgr">' + esc(b.name) + '</div><div class="yrs"><span class="trophy">' + plural(b.yrs.length, 'title', 'titles') + '</span> (' + b.yrs.slice().sort().join(', ') + ')</div></div>';
      }).join('') + '</div><h3 class="subhead">Season by Season</h3><div class="seasons">' + seasons.map(function (s) {
        var li = function (k, p, withPts) {
          if (!p) return '';
          return '<li><span class="k">' + k + '</span><span>' + esc(names && p.manager ? p.manager : p.name) + (withPts && p.points ? ' <span class="sub">' + pts2(p.points) + '</span>' : '') +
            (names && p.manager ? '<span class="t">' + esc(p.name) + '</span>' : '') + '</span></li>';
        };
        return '<div class="card season"><div class="season-head"><b>' + esc(s.season) + '</b><span class="sub">' + (s.teams ? esc(s.teams) + ' teams' : '') + '</span></div><ul class="season-list">' +
          li('Champion', s.champion) + li('Runner-up', s.runnerUp) + li('Third place', s.third) + li('Most points', s.mostPoints, true) + '</ul></div>';
      }).join('') + '</div>';
    return html;
  }

  // ====== Draft ======
  var DRAFT_TYPES = { SNAKE: 'Snake draft', AUCTION: 'Auction draft', OFFLINE: 'Offline draft', AUTOPICK: 'Autopick draft' };
  function draftWhen(ms) {
    var d = new Date(ms);
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) + ' at ' +
      d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
  }
  function countdown(X) {
    var ms = X.date ? X.date - Date.now() : 0;
    if (X.inProgress || (X.date && ms <= 0)) return { k: 'Draft', v: 'On Now' };
    var m = Math.ceil(ms / 60000), days = Math.floor(m / 1440), hrs = Math.floor((m % 1440) / 60);
    return { k: 'Starts In', v: (days ? days + 'd ' : '') + (days || hrs ? hrs + 'h ' : '') + (m % 60) + 'm' };
  }
  function renderDraft() {
    var f = D(), X = f.draft, el = $('#v-draft');
    if (!inDraft() || !X) { el.innerHTML = ''; return; }
    var html = '<h1>' + esc(X.season) + ' Draft</h1><p class="lede">' + (X.date ? esc(draftWhen(X.date)) : 'The draft date isn’t set on ESPN yet') + '</p>';
    if (X.date || X.inProgress) {
      var c = countdown(X), notes = [DRAFT_TYPES[X.type], X.pickSeconds ? X.pickSeconds + ' seconds per pick' : '', X.type === 'AUCTION' && X.auctionBudget ? '$' + X.auctionBudget + ' budget' : ''].filter(Boolean);
      html += '<div class="card pot"><div class="sub" id="cd-k">' + c.k + '</div><div class="big" id="cd-v">' + c.v + '</div>' +
        (notes.length ? '<div class="parts">' + notes.map(function (n) { return '<span>' + esc(n) + '</span>'; }).join('') + '</div>' : '') + '</div>';
    }
    if (X.order && X.order.length) {
      html += '<h2>Draft Order</h2><p class="lede">' + (X.orderSource === 'espn' ? 'Set on ESPN' : 'Reverse of last season’s final standings (until the commissioner sets it on ESPN)') + '</p>' +
        '<div class="card tbl-wrap"><table class="tbl"><tbody>' + X.order.map(function (o) { return '<tr><td class="rk">' + o.pick + '</td><td>' + who(team(o.id)) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    var K = f.keepers;
    if (K) {
      html += '<h2>' + esc(K.season) + ' Keepers</h2>' + (K.list.length ? keeperIntro(K) + keeperTable(K.list, f.money) : '<div class="card empty"><p class="sub">Keepers show up here once they’re set on ESPN.</p></div>');
      if (K.last && K.last.list.length) html += '<h2>' + esc(K.last.season) + ' Keepers</h2><p class="lede">Last season’s keepers</p>' + keeperTable(K.last.list, null);
    }
    html += '<div class="links"><a class="btn acc" href="' + esc(f.league.espnUrl) + '" target="_blank" rel="noopener">Open the League on ESPN</a></div>';
    el.innerHTML = html;
  }
  function tickCountdown() {
    var f = D();
    if (state.view !== 'draft' || !f.draft || !$('#cd-v')) return;
    var c = countdown(f.draft);
    $('#cd-k').textContent = c.k; $('#cd-v').textContent = c.v;
  }

  // ====== Commissioner Tools ======
  // The passcode is checked by Apps Script (never stored in this page); this browser tab remembers it until it's closed.
  var CM_KEY = 'leaguehub_commish';
  var cm = { pass: '', data: null, busy: false, msg: '', err: '' };
  function cmStored() { try { return sessionStorage.getItem(CM_KEY) || ''; } catch (e) { return ''; } }
  function cmStore(p) { try { if (p) sessionStorage.setItem(CM_KEY, p); else sessionStorage.removeItem(CM_KEY); } catch (e) {} }
  function cmCall(body, done) {
    cm.busy = true; cm.msg = ''; cm.err = ''; renderCommish();
    var p = GAS
      ? new Promise(function (resolve, reject) { google.script.run.withSuccessHandler(function (s) { resolve(JSON.parse(s)); }).withFailureHandler(reject).lhCommish(body); })
      : fetch(FEED_URL, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    p.then(function (res) {
      if (res.badPass || res.locked || res.noPass) { cm.pass = ''; cm.data = null; cmStore(''); }
      if (!res.ok) cm.err = res.error || 'Something went wrong. Try again.';
      else done(res);
    }).catch(function () { cm.err = 'Couldn’t reach the league’s spreadsheet. Check your connection and try again.'; })
      .then(function () { cm.busy = false; if (state.view === 'commish') renderCommish(); });
  }
  function cmLogin(pass) { cm.pass = pass; cmCall({ pass: pass, action: 'login' }, function (res) { cmStore(pass); cm.data = res; }); }
  // Where a team stands, next to its name when recording a payment: its dues, then (after the season) its settle-up
  function moneyTag(X, t) {
    if (!X.moneyOn || t.settle == null) return '';
    if (phase() === 'complete') return t.balance < 0 ? ' (pays ' + money(-t.balance) + ')' : t.balance > 0 ? ' (gets ' + money(t.balance) + ')' : ' (settled)';
    if (X.duesUpFront && t.duesLeft > 0) return ' (dues: owes ' + money(t.duesLeft) + ')';
    return X.duesUpFront ? ' (dues paid)' : '';
  }
  function renderCommish() {
    var el = $('#v-commish'), html = '<a class="back" href="#league">' + BACK_ICON + 'League</a><h1>Commissioner Tools</h1>';
    var note = (cm.err ? '<p class="cm-msg err" role="alert">' + esc(cm.err) + '</p>' : '') + (cm.msg ? '<p class="cm-msg ok" role="status">' + esc(cm.msg) + '</p>' : '');
    if (!canLoad()) { el.innerHTML = html + '<p class="lede">These tools work on the live website</p>'; return; }
    if (!cm.pass && cmStored() && !cm.busy && !cm.err) { cmLogin(cmStored()); return; }
    if (!cm.data) {
      el.innerHTML = html + '<p class="lede">Enter the commissioner passcode</p><form class="card cm-form" data-cm="login">' +
        '<input class="cm-in" type="password" id="cm-pass" autocomplete="current-password" aria-label="Passcode"' + (cm.busy ? ' disabled' : '') + '>' +
        '<button class="btn acc" type="submit"' + (cm.busy ? ' disabled' : '') + '>' + (cm.busy ? 'Checking' : 'Unlock') + '</button></form>' + note;
      return;
    }
    var X = cm.data, st = X.status || {};
    html += '<p class="lede">' + esc(X.league) + '</p>';
    html += '<div class="card empty"><p><b>Last update from ESPN:</b> ' + (st.at ? esc(ago(st.at)) : 'not yet') + (st.ok === false ? ' (failed' + (st.problem === 'auth' ? ': ESPN needs fresh cookies' : '') + ')' : '') + '</p>' +
      '<div class="links" style="margin-top:8px"><button class="btn acc" type="button" data-cm-act="refresh"' + (cm.busy ? ' disabled' : '') + '>Update Now</button>' +
      '<button class="btn" type="button" data-cm-act="lock">Lock</button></div></div>' + note;
    // Payments
    html += '<h2>Record a Payment</h2><p class="lede">Positive: the team paid the league. Negative: the league paid the team. It’s added to the Payments tab of the spreadsheet</p>' +
      '<form class="card cm-grid" data-cm="payment"><label>Team<select class="cm-in" id="cm-team">' + X.teams.map(function (t) {
        return '<option value="' + t.id + '">' + esc(t.name) + moneyTag(X, t) + '</option>';
      }).join('') + '</select></label><label>Amount<input class="cm-in" id="cm-amount" inputmode="decimal" placeholder="100 or -250"></label>' +
      '<label>Note (optional)<input class="cm-in" id="cm-note" maxlength="200" placeholder="Venmo, cash, prize…"></label>' +
      '<div><button class="btn acc" type="submit"' + (cm.busy ? ' disabled' : '') + '>' + (cm.busy ? 'Saving' : 'Save Payment') + '</button></div></form>';
    if (X.payments && X.payments.length) html += '<h3 class="subhead">Recent Payments</h3><div class="card tbl-wrap"><table class="tbl"><tbody>' + X.payments.map(function (p) {
      return '<tr><td>' + esc(p.team) + (p.note ? '<div class="mg">' + esc(p.note) + '</div>' : '') + '</td><td class="num big">' + money(p.amount, true) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
    if (X.unmatched) html += '<p class="sub">' + plural(X.unmatched, 'payment on the Payments tab doesn’t', 'payments on the Payments tab don’t') + ' match a team name. Fix the team name in the spreadsheet.</p>';
    // Cookies
    html += '<h2>ESPN Cookies</h2><p class="lede">For private leagues. ' + (X.cookies ? 'Cookies are saved. Paste new ones if updates stop working' : 'No cookies saved (public leagues don’t need them)') + '</p>' +
      '<ol class="cm-steps"><li>On a computer, open <a href="' + esc((D().league || {}).espnUrl || 'https://fantasy.espn.com') + '" target="_blank" rel="noopener">your league on ESPN</a> and log in.</li>' +
      '<li>Open the developer tools (Chrome: View → Developer → Developer Tools; Safari: Develop → Show Web Inspector).</li>' +
      '<li>Go to Application (Chrome) or Storage (Safari) → Cookies → fantasy.espn.com.</li>' +
      '<li>Copy SWID (with the curly brackets) and espn_s2 into the boxes below.</li></ol>' +
      '<form class="card cm-grid" data-cm="cookies" style="margin-top:12px"><label>SWID<input class="cm-in" id="cm-swid" autocomplete="off" autocapitalize="off" spellcheck="false"></label>' +
      '<label>espn_s2<textarea class="cm-in" id="cm-s2" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></label>' +
      '<div><button class="btn acc" type="submit"' + (cm.busy ? ' disabled' : '') + '>' + (cm.busy ? 'Testing' : 'Save Cookies') + '</button></div></form>';
    el.innerHTML = html;
  }
  document.addEventListener('submit', function (e) {
    var form = e.target.closest('[data-cm]');
    if (!form) return;
    e.preventDefault();
    if (cm.busy) return;
    var kind = form.getAttribute('data-cm');
    if (kind === 'login') { var pass = ($('#cm-pass') || {}).value || ''; if (pass) cmLogin(pass); }
    else if (kind === 'payment') {
      var amt = Number(String(($('#cm-amount') || {}).value || '').replace(/−/g, '-').replace(/[$,\s]/g, ''));
      if (!isFinite(amt) || !amt) { cm.err = 'Enter an amount like 100 (paid in) or -250 (paid out).'; cm.msg = ''; renderCommish(); return; }
      cmCall({ pass: cm.pass, action: 'payment', team: ($('#cm-team') || {}).value, amount: amt, note: ($('#cm-note') || {}).value || '' },
        function (res) { cm.data = res; cm.msg = res.message || 'Saved.'; refresh(); });
    } else if (kind === 'cookies') {
      var swid = ($('#cm-swid') || {}).value || '', s2 = ($('#cm-s2') || {}).value || '';
      if (!swid.trim() || !s2.trim()) { cm.err = 'Paste both SWID and espn_s2.'; cm.msg = ''; renderCommish(); return; }
      cmCall({ pass: cm.pass, action: 'cookies', swid: swid, s2: s2 }, function (res) { cm.data = res; cm.msg = res.message || 'Saved.'; refresh(); });
    }
  });

  // ====== Render everything ======
  function renderAll() {
    var f = D();
    if (f.league && f.league.accent) applyAccent(f.league.accent);
    renderChrome(); renderWeek(); renderStandings(); renderScores(); renderPlayoffs(); renderMoney(); renderLeague(); renderDraft();
    if (state.view === 'matchup') renderMatchup();
  }

  // ====== Events ======
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (a && !e.defaultPrevented) {
      e.preventDefault();
      go(a.getAttribute('href'));
      return;
    }
    var t = e.target.closest('[data-stand],[data-act],[data-team],[data-mp],[data-cm-act],[data-sample]');
    if (!t) return;
    if (t.hasAttribute('data-sample')) { showSample(t.getAttribute('data-sample')); return; }
    if (t.hasAttribute('data-cm-act')) {
      var act = t.getAttribute('data-cm-act');
      if (act === 'lock') { cm.pass = ''; cm.data = null; cm.msg = cm.err = ''; cmStore(''); renderCommish(); }
      else if (act === 'refresh') cmCall({ pass: cm.pass, action: 'refresh' }, function (res) { cm.data = res; cm.msg = res.message || 'Updated.'; refresh(); });
      return;
    }
    if (t.hasAttribute('data-stand')) { state.standMode = t.getAttribute('data-stand'); renderStandings(); }
    else if (t.hasAttribute('data-team')) { var n = t.getAttribute('data-team'); state.hlTeam = state.hlTeam === n ? '' : n; renderPlayoffs(); }
    else if (t.hasAttribute('data-mp')) { state.scoresMp = Number(t.getAttribute('data-mp')); renderScores(); }
    else if (t.getAttribute('data-act') === 'retry') refresh();
  });
  $('#refresh').addEventListener('click', refresh);
  if (!GAS) window.addEventListener('hashchange', function () { route(location.hash); });
  var relayout = function () { if (tk.el) tickerMeasure(); if (state.view === 'matchup') fitLines($('#v-matchup')); };
  window.addEventListener('resize', relayout);
  try {
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function () { var L = D().league; if (L && L.accent) applyAccent(L.accent); });
  } catch (e) {}
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  document.addEventListener('visibilitychange', maybeRefresh);
  setInterval(maybeRefresh, 60000);
  setInterval(renderChrome, 30000);
  setInterval(tickCountdown, 30000);

  // ====== Demo page: pick which sample to show ======
  function sampleData(feed) {
    if (feed.draft && feed.draft.date && !feed.draft.inProgress) feed.draft.date = Date.now() + (2 * 24 + 5) * 3600000 + 17 * 60000;   // always upcoming
    return feed;
  }
  function showSample(id) {
    var pick = SAMPLES.filter(function (x) { return x.id === id; })[0] || SAMPLES[0];
    state.sample = pick.id; state.data = sampleData(pick.feed);
    state.standMode = 'overall'; state.scoresMp = 0; state.hlTeam = '';
    try { history.replaceState(null, '', location.pathname + '?sample=' + encodeURIComponent(pick.id)); } catch (e) {}
    renderAll();
    if (state.view) go('');
  }

  // ====== Start ======
  var saved = GAS || !canLoad() ? null : loadSaved();
  state.sample = '';
  if (!canLoad() && SAMPLES && SAMPLES.length) {
    var want = (/[?&]sample=([^&#]+)/.exec(location.search) || [])[1];
    var pick = SAMPLES.filter(function (x) { return x.id === decodeURIComponent(want || ''); })[0] || SAMPLES[0];
    state.sample = pick.id;
    state.data = sampleData(pick.feed);
  } else {
    state.data = BOOT || (saved && saved.data) || { ok: false, error: 'Loading…' };
  }
  state.fetchedAt = BOOT ? Date.now() : saved ? saved.fetchedAt : 0;
  renderAll();
  if (GAS) {
    try {
      google.script.history.setChangeHandler(function (e) { route(e.location.hash); });
      google.script.url.getLocation(function (loc) { route(loc.hash || ''); });
    } catch (e) { route(''); }
  } else {
    route(location.hash);
  }
  maybeRefresh();
})();
</script>
</body>
</html>
